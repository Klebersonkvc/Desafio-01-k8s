apiVersion: v1
kind: Service
metadata:
  name: desafio1-api
spec:
  type: NodePort
  selector:
    app: desafio1-api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desafio1-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: desafio1-api
  template:
    metadata:
      labels:
        app: desafio1-api
    spec:
      containers:
        - name: desafio1-api
          image: desafio1-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: desafio1-config
            - secretRef:
                name: desafio1-secret
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "50m"
            limits:
              cpu: "200m"